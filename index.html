<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="background-fill"></div>
  <div class="container">
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 water cans to complete the game!</p>
    <form>
		<label for="difficulty">Choose a difficulty:</label>
		  <select id="difficulty" name="difficulty">
			  <option value="easy">Easy</option>
			  <option value="hard">Hard</option>
        <option value="very-hard">Impossible</option>
		  </select>
	  </form>
    <div class="stats">  
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div class="timer-bar-container">
      <div class="timer-bar"></div>
    </div>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid"></div>
    <button id="start-game">Start Game</button>
  </div>
  <div class="game-over-popup-container"> <div class="game-over-popup">
    <h2 id="popup-text">Game Over!</h2>
    <p id="final-score"></p>
    <br>
    <p> Check out Charity: Water's site and see how you can help!</p>
    <a href="https://www.charitywater.org/" target="_blank" class="charity-link">Visit Charity: Water</a>
    <br>
    <br>
    <a href="https://www.charitywater.org/donate" target="_blank" class="charity-link">Donate Now</a>
    <button id="game-over-button">Close</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
